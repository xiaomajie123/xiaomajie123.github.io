                <h3 id="1-java基础语法："><a href="#1-java基础语法：" class="headerlink" title="1.java基础语法："></a>1.java基础语法：</h3><ol>
<li><p>java关键字：</p>
<figure class="highlight markdown"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br></pre></td><td class="code"><pre><code class="hljs markdown"><span class="hljs-bullet">1.</span> abstract：** 用于声明抽象类，以及抽象方法。<br><span class="hljs-bullet">2.</span> <span class="hljs-strong">**boolean：**</span> 用于将变量声明为布尔值类型，只有 true 和 false 两个值。<br><span class="hljs-bullet">3.</span> <span class="hljs-strong">**break：**</span> 用于中断循环或 switch 语句。<br><span class="hljs-bullet">4.</span> <span class="hljs-strong">**byte：**</span> 用于声明一个可以容纳 8 个比特的变量。<br><span class="hljs-bullet">5.</span> <span class="hljs-strong">**case：**</span> 用于在 switch 语句中标记条件的值。<br><span class="hljs-bullet">6.</span> <span class="hljs-strong">**catch：**</span> 用于捕获 try 语句中的异常。<br><span class="hljs-bullet">7.</span> <span class="hljs-strong">**char：**</span> 用于声明一个可以容纳无符号 16 位比特的 [<span class="hljs-string">Unicode 字符</span>](<span class="hljs-link">https://mp.weixin.qq.com/s/pNQjlXOivIgO3pbYc0GnpA</span>)的变量。<br><span class="hljs-bullet">8.</span> <span class="hljs-strong">**class：**</span> 用于声明一个类。<br><span class="hljs-bullet">9.</span> <span class="hljs-strong">**continue：**</span> 用于继续下一个循环，可以在指定条件下跳过其余代码。<br><span class="hljs-bullet">10.</span> <span class="hljs-strong">**default：**</span> 用于指定 switch 语句中除去 case 条件之外的默认代码块。<br><span class="hljs-bullet">11.</span> <span class="hljs-strong">**do：**</span> 通常和 while 关键字配合使用，do 后紧跟循环体。<br><span class="hljs-bullet">12.</span> <span class="hljs-strong">**double：**</span> 用于声明一个可以容纳 64 位浮点数的变量。<br><span class="hljs-bullet">13.</span> <span class="hljs-strong">**else：**</span> 用于指示 if 语句中的备用分支。<br><span class="hljs-bullet">14.</span> <span class="hljs-strong">**enum：**</span> 用于定义一组固定的常量（枚举）。<br><span class="hljs-bullet">15.</span> <span class="hljs-strong">**extends：**</span> 用于指示一个类是从另一个类或接口继承的。<br><span class="hljs-bullet">16.</span> <span class="hljs-strong">**final：**</span> 用于指示该变量是不可更改的。<br><span class="hljs-bullet">17.</span> <span class="hljs-strong">**finally：**</span> 和 <span class="hljs-code">`try-catch`</span> 配合使用，表示无论是否处理异常，总是执行 finally 块中的代码。<br><span class="hljs-bullet">18.</span> <span class="hljs-strong">**float：**</span> 用于声明一个可以容纳 32 位浮点数的变量。<br><span class="hljs-bullet">19.</span> <span class="hljs-strong">**for：**</span> 用于声明一个 for 循环，如果循环次数是固定的，建议使用 for 循环。<br><span class="hljs-bullet">20.</span> <span class="hljs-strong">**if：**</span> 用于指定条件，如果条件为真，则执行对应代码。<br><span class="hljs-bullet">21.</span> <span class="hljs-strong">**implements：**</span> 用于实现接口。<br><span class="hljs-bullet">22.</span> <span class="hljs-strong">**import：**</span> 用于导入对应的类或者接口。<br><span class="hljs-bullet">23.</span> <span class="hljs-strong">**instanceof：**</span> 用于判断对象是否属于某个类型（class）。<br><span class="hljs-bullet">24.</span> <span class="hljs-strong">**int：**</span> 用于声明一个可以容纳 32 位带符号的整数变量。<br><span class="hljs-bullet">25.</span> <span class="hljs-strong">**interface：**</span> 用于声明接口。<br><span class="hljs-bullet">26.</span> <span class="hljs-strong">**long：**</span> 用于声明一个可以容纳 64 位整数的变量。<br><span class="hljs-bullet">27.</span> <span class="hljs-strong">**native：**</span> 用于指定一个方法是通过调用本机接口（非 Java）实现的。<br><span class="hljs-bullet">28.</span> <span class="hljs-strong">**new：**</span> 用于创建一个新的对象。<br><span class="hljs-bullet">29.</span> <span class="hljs-strong">**null：**</span> 如果一个变量是空的（什么引用也没有指向），就可以将它赋值为 null，和空指针异常息息相关。<br><span class="hljs-bullet">30.</span> <span class="hljs-strong">**package：**</span> 用于声明类所在的包。<br><span class="hljs-bullet">31.</span> <span class="hljs-strong">**private：**</span> 一个访问权限修饰符，表示方法或变量只对当前类可见。<br><span class="hljs-bullet">32.</span> <span class="hljs-strong">**protected：**</span> 一个访问权限修饰符，表示方法或变量对同一包内的类和所有子类可见。<br><span class="hljs-bullet">33.</span> <span class="hljs-strong">**public：**</span> 一个访问权限修饰符，除了可以声明方法和变量（所有类可见），还可以声明类。<span class="hljs-code">`main()`</span> 方法必须声明为 public。<br><span class="hljs-bullet">34.</span> <span class="hljs-strong">**return：**</span> 用于在代码执行完成后返回（一个值）。<br><span class="hljs-bullet">35.</span> <span class="hljs-strong">**short：**</span> 用于声明一个可以容纳 16 位整数的变量。<br><span class="hljs-bullet">36.</span> <span class="hljs-strong">**static：**</span> 表示该变量或方法是静态变量或静态方法。<br><span class="hljs-bullet">37.</span> <span class="hljs-strong">**strictfp：**</span> 并不常见，通常用于修饰一个方法，确保方法体内的浮点数运算在每个平台上执行的结果相同。<br><span class="hljs-bullet">38.</span> <span class="hljs-strong">**super：**</span> 可用于调用父类的方法或者字段。<br><span class="hljs-bullet">39.</span> <span class="hljs-strong">**switch：**</span> 通常用于三个（以上）的条件判断。<br><span class="hljs-bullet">40.</span> <span class="hljs-strong">**synchronized：**</span> 用于指定多线程代码中的同步方法、变量或者代码块。<br><span class="hljs-bullet">41.</span> <span class="hljs-strong">**this：**</span> 可用于在方法或构造函数中引用当前对象。<br><span class="hljs-bullet">42.</span> <span class="hljs-strong">**throw：**</span> 主动抛出异常。<br><span class="hljs-bullet">43.</span> <span class="hljs-strong">**throws：**</span> 用于声明异常。<br><span class="hljs-bullet">44.</span> <span class="hljs-strong">**transient：**</span> 修饰的字段不会被序列化。<br><span class="hljs-bullet">45.</span> <span class="hljs-strong">**try：**</span> 于包裹要捕获异常的代码块。<br><span class="hljs-bullet">46.</span> <span class="hljs-strong">**void：**</span> 用于指定方法没有返回值。<br><span class="hljs-bullet">47.</span> <span class="hljs-strong">**volatile：**</span> 保证不同线程对它修饰的变量进行操作时的可见性，即一个线程修改了某个变量的值，新值对其他线程来说是立即可见的。<br><span class="hljs-bullet">48.</span> <span class="hljs-strong">**while：**</span> 如果循环次数不固定，建议使用 while 循环。<br></code></pre></td></tr></table></figure></li>
</ol>

<script>
  Fluid.utils.createScript('https://lib.baomitu.com/tocbot/4.20.1/tocbot.min.js', function() {
    var toc = jQuery('#toc');
    if (toc.length === 0 || !window.tocbot) { return; }
    var boardCtn = jQuery('#board-ctn');
    var boardTop = boardCtn.offset().top;

    function isExpandAllEnabled() {
      return CONFIG.toc && CONFIG.toc.expand_all === true;
    }
    function expandAllToc() {
      if (!isExpandAllEnabled()) { return; }
      jQuery('#toc-body .tocbot-is-collapsed').removeClass('tocbot-is-collapsed');
    }
    function updateTocToggle($li, $childList) {
      var $toggle = $li.children('.toc-toggle');
      if ($toggle.length === 0) { return; }
      var collapsed = $childList.hasClass('tocbot-is-collapsed');
      $toggle
        .toggleClass('toc-toggle-collapsed', collapsed)
        .toggleClass('toc-toggle-expanded', !collapsed);
    }
    function bindTocToggle() {
      if (!isExpandAllEnabled()) { return; }
      jQuery('#toc-body .toc-list-item').each(function() {
        var $li = jQuery(this);
        var $childList = $li.children('ol');
        if ($childList.length === 0) {
          if ($li.children('.toc-toggle').length === 0) {
            $li.prepend('<span class="toc-toggle toc-toggle-placeholder" aria-hidden="true">›</span>');
          }
          return;
        }

        if ($li.children('.toc-toggle').length === 0) {
          $li.prepend('<span class="toc-toggle toc-toggle-expanded" aria-hidden="true">›</span>');
        }
        updateTocToggle($li, $childList);
      });
      jQuery('#toc-body').off('click.tocToggle').on('click.tocToggle', '.toc-toggle', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var $li = jQuery(this).parent('.toc-list-item');
        var $childList = $li.children('ol');
        if ($childList.length === 0) { return; }
        $childList.toggleClass('tocbot-is-collapsed');
        updateTocToggle($li, $childList);
      });
      if (!window.__tocToggleObserver) {
        window.__tocToggleObserver = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type !== 'attributes' || mutation.attributeName !== 'class') { return; }
            var $list = jQuery(mutation.target);
            var $li = $list.parent('.toc-list-item');
            if ($li.length === 0) { return; }
            updateTocToggle($li, $list);
          });
        });
        jQuery('#toc-body ol').each(function() {
          window.__tocToggleObserver.observe(this, { attributes: true });
        });
      }
    }
    var tocConfig = Object.assign({
      tocSelector     : '#toc-body',
      contentSelector : '.markdown-body',
      linkClass       : 'tocbot-link',
      activeLinkClass : 'tocbot-active-link',
      listClass       : 'tocbot-list',
      isCollapsedClass: 'tocbot-is-collapsed',
      collapsibleClass: 'tocbot-is-collapsible',
      scrollSmooth    : true,
      includeTitleTags: true,
      headingsOffset  : -boardTop,
    }, CONFIG.toc);
    if (isExpandAllEnabled()) {
      tocConfig.collapseDepth = 6;
    }
    window.tocbot.init(tocConfig);
    if (toc.find('.toc-list-item').length > 0) {
      toc.css('visibility', 'visible');
    }
    expandAllToc();
    bindTocToggle();

    Fluid.events.registerRefreshCallback(function() {
      if ('tocbot' in window) {
        tocbot.refresh();
        var toc = jQuery('#toc');
        if (toc.length === 0 || !tocbot) {
          return;
        }
        if (toc.find('.toc-list-item').length > 0) {
          toc.css('visibility', 'visible');
        }
        expandAllToc();
        bindTocToggle();
      }
    });
  });
</script>

<script>
  Fluid.utils.createScript('https://lib.baomitu.com/anchor-js/5.0.0/anchor.min.js', function() {
    window.anchors.options = {
      placement: CONFIG.anchorjs.placement,
      visible  : CONFIG.anchorjs.visible
    };
    if (CONFIG.anchorjs.icon) {
      window.anchors.options.icon = CONFIG.anchorjs.icon;
    }
    var el = (CONFIG.anchorjs.element || 'h1,h2,h3,h4,h5,h6').split(',');
    var res = [];
    for (var item of el) {
      res.push('.markdown-body > ' + item.trim());
    }
    if (CONFIG.anchorjs.placement === 'left') {
      window.anchors.options.class = 'anchorjs-link-left';
    }
    window.anchors.add(res.join(', '));

    Fluid.events.registerRefreshCallback(function() {
      if ('anchors' in window) {
        anchors.removeAll();
        var el = (CONFIG.anchorjs.element || 'h1,h2,h3,h4,h5,h6').split(',');
        var res = [];
        for (var item of el) {
          res.push('.markdown-body > ' + item.trim());
        }
        if (CONFIG.anchorjs.placement === 'left') {
          anchors.options.class = 'anchorjs-link-left';
        }
        anchors.add(res.join(', '));
      }
    });
  });
</script>
